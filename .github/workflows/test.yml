name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Install bats
      run: |
        sudo apt-get update
        sudo apt-get install -y bats
    
    - name: Check go fmt
      run: go fmt ./... && git diff --exit-code
    
    - name: Verify dependencies
      run: |
        go mod tidy
        go mod verify
        git diff --exit-code go.mod go.sum
    
    - name: Build
      run: go build
    
    - name: Run go tests
      run: go test -v ./...
    
    - name: Setup integration test dependencies
      run: ./integration_tests/setup.sh
    
    - name: Run bats integration tests
      run: bats integration_tests